# 로컬 개발용 인프라 (설계 9.1). API·워커·웹 서비스는 구현되는 대로 추가한다.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: noticedelta
      POSTGRES_PASSWORD: noticedelta
      POSTGRES_DB: noticedelta
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noticedelta"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: noticedelta
      MINIO_ROOT_PASSWORD: noticedelta-dev
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
