[project]
name = "noticedelta"
version = "0.1.0"
description = "정정공고가 나오면 내 자격·마감·금액 변화만 알려 주는 지원사업 비서와 변경 영향 엔진"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.4",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noticedelta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
